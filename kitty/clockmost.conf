# clockmost kitty behaviour (pkgs/endfield-skins) - included from ~/.config/kitty/kitty.conf by clockmost-desktop-setup.
# The look is endfield.conf; this is how it acts.

# the cursor trail is the terminal's motion
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Windows Terminal habits: right click pastes, Ctrl+V pastes (also what Win+V's paste-on-pick presses), Ctrl+C
# copies a selection else interrupts. Ctrl+Shift+V / Ctrl+Shift+C still work.
mouse_map right press ungrabbed paste_from_clipboard
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt
