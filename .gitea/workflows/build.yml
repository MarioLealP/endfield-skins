# Per-package workflow: only pkgname + deps live here; the gates are in pkgs/packaging's generic-pkg.yml.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pkg:
    uses: pkgs/packaging/.gitea/workflows/generic-pkg.yml@main
    with:
      pkgname: endfield-skins
      # makepkg runs without sudo in CI: depends must be preinstalled here
      extra_pacman_deps: "ttf-jetbrains-mono inter-font python"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
